{% extends "base.html" %}{% block title %}FitBuddy{% endblock %}{% block content %}<section class="card"><span>AI FITNESS PLANNER</span><h1>Your personalized 7-day fitness plan.</h1><p>Enter your details to generate a workout plan and nutrition tip.</p><form action="/generate-workout" method="post" class="grid"><label>User ID<input name="user_id" required></label><label>Name<input name="name" required></label><label>Age<input name="age" type="number" min="13" max="100" required></label><label>Weight (kg)<input name="weight" type="number" min="20.1" max="399.9" step="0.1" required></label><label>Goal<select name="goal"><option>weight loss</option><option>muscle gain</option><option>general wellness</option><option>flexibility</option></select></label><label>Intensity<select name="intensity"><option>low</option><option selected>medium</option><option>high</option></select></label><button>Generate My Plan →</button></form></section>{% endblock %}
